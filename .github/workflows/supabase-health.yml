name: Supabase health check

# NOT a keepalive. This started life as one and the experiment failed: it pinged
# successfully every Mon/Wed/Fri from 24 Aug to 2 Sep 2026 and the project paused
# anyway on ~3 Sep. Anonymous REST requests do not count as activity for
# Supabase's inactivity timer. Only Pro removes pausing.
#
# Kept because it works as a monitor. A red run is the earliest warning that the
# project is paused or the key has rotated — it caught the September pause within
# two days, well inside the 90-day window after which a paused project cannot be
# restored at all.

on:
  schedule:
    - cron: "0 6 * * 1,3,5"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Is the database reachable?
        env:
          URL: ${{ secrets.VITE_SUPABASE_URL }}
          KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          # curl exit 6 (cannot resolve host) is the signature of a paused
          # project: the subdomain stops resolving entirely.
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 \
            "$URL/rest/v1/slots?select=id&limit=1" -H "apikey: $KEY") || true
          echo "HTTP $code"
          if [ "$code" != "200" ]; then
            echo "::error::Supabase is not answering (HTTP $code). Most likely the free-tier project has paused — restore it from the dashboard. It cannot be restored at all after 90 days."
            exit 1
          fi
